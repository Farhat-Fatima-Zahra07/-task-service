name: CI/CD TaskFlow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  
  build-and-test:
    name: Build et Tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compiler le projet
        run: mvn compile -B

      - name: Lancer les tests JUnit
        run: mvn test -B

      - name: Packager le projet
        run: mvn package -DskipTests -B

      - name: Sauvegarder le JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar


  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Build image Docker
        run: docker build -t taskflow:latest .